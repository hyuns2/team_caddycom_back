version: '3.8'

services:
  redis:
    image: redis
    container_name: redis
    ports:
      - 6379:6379
    networks:
      - caddycom_net

  caddycom-backend:
    image: ${DOCKERHUB_USERNAME}/${DOCKER_IMAGE}
    container_name: ${DOCKER_IMAGE}
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - 8080:8080
    depends_on:
      - redis
    networks:
      - caddycom_net

networks:
  caddycom_net:
    driver: bridge
